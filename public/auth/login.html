<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to Manage Your Requests — Car Hive</title>
  <meta name="description" content="Log in to track your Car Hive battery service request, see your technician's ETA, and download invoices, test reports and warranty records.">
  <link rel="icon" href="../../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/css/styles.css">
</head>
<body>

<section class="auth-page" style="padding: 80px 0 80px; min-height: 85vh; display: flex; align-items: center; justify-content: center;">
  <div class="auth-card">
    <div class="auth-header">
      <a href="../../index.html" class="logo" style="justify-content: center; margin-bottom: 20px;"><img src="../../assets/img/logo.png" alt="Car Hive Logo" class="logo-img"><span class="logo-text-group"><span class="logo-brand-title">CAR HIVE</span></span></a>
      <h2>Manage Your Requests</h2>
      <p>Log in to track a booked visit, follow your technician, and keep every battery record in one place.</p>
    </div>
    <form class="auth-form" data-type="login">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" placeholder="you@example.com" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="Enter your password" required>
        <span class="form-error"></span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap;">
        <div class="checkbox-group"><input type="checkbox" id="remember"><label for="remember">Remember me</label></div>
        <a href="#" style="color:var(--amber);font-size:13px;">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-solid btn-block">Sign In</button>
    </form>

    <div class="auth-divider">or</div>
    <div style="display:grid;gap:10px;">
      <button class="auth-social-btn">Continue with Google</button>
      <button class="auth-social-btn">Continue with Apple</button>
    </div>

    <div class="auth-switch">No account yet? <a href="signup.html">Create one</a></div>
  </div>
</section>

<script src="../../src/js/theme.js"></script>
<script src="../../src/js/data.js"></script>
<script src="../../src/js/form-validation.js"></script>
<script src="../../src/js/main.js"></script>
</body>
</html>
