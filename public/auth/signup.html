<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — CAR HIVE</title>
<link rel="icon" href="../../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/css/styles.css">
</head>
<body>



<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a href="../../index.html" class="logo"><span class="dot"></span>CAR HIVE</a>
      <h2>Create Account</h2>
      <p>Join CarHive today</p>
    </div>
    <form class="auth-form" data-type="signup">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" placeholder="John Doe" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" placeholder="you@example.com" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="Min 8 characters" required data-minlength="8">
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-input" placeholder="Confirm password" required>
        <span class="form-error"></span>
      </div>
      <div class="checkbox-group" style="margin-bottom:24px;">
        <input type="checkbox" id="terms" required>
        <label for="terms" style="font-size:13px;color:var(--steel);">I agree to the <a href="../pages/terms-of-service.html" style="color:var(--amber);">Terms of Service</a> and <a href="../pages/privacy-policy.html" style="color:var(--amber);">Privacy Policy</a></label>
      </div>
      <button type="submit" class="btn btn-solid" style="width:100%;text-align:center;">Create Account</button>
    </form>
    <div class="auth-divider">OR</div>
    <button class="auth-social-btn">Continue with Google</button>
    <button class="auth-social-btn">Continue with Apple</button>
    <div class="auth-switch">Already have an account? <a href="login.html">Sign In</a></div>
  </div>
</section>

<script src="../../src/js/theme.js"></script>
<script src="../../src/js/data.js"></script>
<script src="../../src/js/form-validation.js"></script>
<script src="../../src/js/main.js"></script>
</body>
</html>
